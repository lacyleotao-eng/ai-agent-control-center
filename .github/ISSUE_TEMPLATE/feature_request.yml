name: Feature request
description: Suggest a bounded improvement to the Community Edition.
title: "feature: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: Features should preserve local-first, human-approved, auditable behavior.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe the smallest useful change.
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: Approval and audit impact
      description: Explain whether the change affects state transitions, external actions, or evidence.
    validations:
      required: true
