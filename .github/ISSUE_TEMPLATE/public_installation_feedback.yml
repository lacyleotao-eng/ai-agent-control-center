name: Public installation feedback
description: Report what happened during a fresh local installation and Demo Workflow test.
title: "public validation: "
labels: [public-validation]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for testing the public alpha. This is a public issue: remove API keys, tokens, cookies, passwords, private project data, database files, `.env` contents, and unredacted screenshots before submitting.
  - type: input
    id: version
    attributes:
      label: Version or commit tested
      placeholder: v0.1.0-alpha or commit SHA
    validations:
      required: true
  - type: input
    id: operating-system
    attributes:
      label: Operating system
      placeholder: macOS 15, Ubuntu 24.04, Windows 11
    validations:
      required: true
  - type: input
    id: node-version
    attributes:
      label: Node.js version
      placeholder: node --version
    validations:
      required: true
  - type: input
    id: pnpm-version
    attributes:
      label: pnpm version
      placeholder: pnpm --version
    validations:
      required: true
  - type: dropdown
    id: install-result
    attributes:
      label: Installation result
      options:
        - Successful
        - Blocked by an error
    validations:
      required: true
  - type: textarea
    id: installation-details
    attributes:
      label: Installation details
      description: Report whether pnpm install, pnpm db:setup, and pnpm dev completed. Include relevant error output with secrets removed.
      placeholder: |
        pnpm install: successful
        pnpm db:setup: successful
        pnpm dev: successful
    validations:
      required: true
  - type: dropdown
    id: workflow-result
    attributes:
      label: Demo Workflow result
      options:
        - Completed end to end
        - Blocked at a workflow step
        - Not tested
    validations:
      required: true
  - type: textarea
    id: workflow-feedback
    attributes:
      label: Workflow and Audit Trail feedback
      description: Which step was unclear or blocked? Was the Audit Trail understandable?
    validations:
      required: true
  - type: textarea
    id: problems
    attributes:
      label: Problems and reproduction steps
      description: Include the smallest reproducible details and browser information. Redact private data.
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Optional. Attach only redacted screenshots that contain no private data, credentials, local paths, or personal identifiers.
  - type: textarea
    id: suggestions
    attributes:
      label: Suggestions
      description: What should be clearer or more usable for a future public tester?
